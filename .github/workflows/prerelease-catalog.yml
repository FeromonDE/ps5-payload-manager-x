name: Refresh GitHub Payload Releases

on:
  push:
    branches: [main]
    paths:
      - 'tools/github_release_catalog.py'
      - '.github/workflows/prerelease-catalog.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-github-payload-releases
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test discovery and release matching
        run: python3 -m unittest discover -s tools -p 'test_github_release_catalog.py'
      - name: Refresh stable and experimental payload versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/github_release_catalog.py --output payloads_prereleases.json --max-versions 8
      - name: Publish only when catalog changed
        run: |
          git add payloads_prereleases.json
          if git diff --cached --quiet; then
            echo 'Already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh payload stable and prerelease catalog'
          git push
